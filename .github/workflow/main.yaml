name: Run commands on different operating systems
on:
  push:
    branches: cicd_pipeline
  pull_request:
    branches: cicd_pipeline

jobs:
#----------
# CI 
#----------
  Maven-test:
    name: Run Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn clean test
   #       ./mvnw test

 
