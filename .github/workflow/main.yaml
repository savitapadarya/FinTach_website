name: Run commands on different operating systems
on:
  push:
    branches: cicd_pipeline
  pull_request:
    branches: cicd_pipeline

jobs:
#----------
# CI ci
#----------
  Maven-build :
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn compile
        

 
