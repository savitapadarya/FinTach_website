name: Run commands on different operating systems
on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
#----------
# CI 
#----------
  Maven-build :
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn compile