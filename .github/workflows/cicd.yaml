name: Run commands on different operating systems
on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
#----------
# CI 1
#----------
  Maven-build :
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve Maven dependencies
        run: mvn dependency:resolve
      - name: Build
        run: mvn compile
        
  security_check:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name:  Trivy_installation
        run: |
          sudo apt-get install wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install trivy -y
      - name:  Trivy_fs_scan
        run: trivy fs --format table -o fs-report.json .
      - name: gitleak installation
        run: sudo apt install gitleaks -y
    #  - name: gitleak_scan
    #    run: gitleaks detect source .
      - name: Gitleaks
        run: gitleaks detect --source . --verbose --redact
  docker:
    runs-on: ubuntu-latest
    needs: [Maven-build, security_check]
    steps:
      - 
        name: Checkout repository
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name:  BUILD Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/finlyt:latest
      
      - 
        name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/finlyt:latest
          format: 'table' 
          exit-code: '0'   ##i can not fix this issue
          ignore-unfixed: true
          severity: LOW,MEDIUM,HIGH,CRITICAL
      -
        name:  push Docker image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/finlyt:latest
            ${{ vars.DOCKERHUB_USERNAME }}/finlyt:${{ github.sha }}
      - 
        name: update tage in helm chart of gitops repo
        uses: actions/checkout@v4
        with:
          repository: "savitapadarya/Finlyt-GitOps"
          token: ${{ secrets.GITOPS_TOKEN }}
          path:  gitops 
      
      -  
        name: push and commit changes to gitops repo
        run: |
          cd gitops
          sed -i "s|image: savitapadarya/finlyt:.*|image: savitapadarya/finlyt:${{ github.sha }}|g"  helm/finlyt/values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/finlyt/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push origin main