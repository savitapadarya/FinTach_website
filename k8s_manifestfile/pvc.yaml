apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc-claim
  namespace: finlyt
spec:
  storageClassName: ""
  volumeName: db-pv-volume
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
