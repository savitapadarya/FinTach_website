### Banking application services manifest file
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: finlyt
  labels:
    app: Finlyt
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30007
  selector:
    app: Finlyt
  type: NodePort

---
### Mysql services manifest file
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: finlyt
  labels:
    app: Finlyt_db
spec:
  ports:
    - name: http
      protocol: TCP
      port: 3306
      targetPort: 3306
  selector:
    app: Finlyt_db
  type: ClusterIP

