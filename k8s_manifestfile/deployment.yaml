###Banking App manifest file for deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finlytdeployment
  namespace: finlyt
  labels:
    app: Finlyt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: Finlyt
  template:
    metadata:
      labels:
        app: Finlyt
    spec:
      initContainers:
      - name: wait-for-database-service
        image: busybox:1.36
        command: ['sh', '-c', "until nslookup db-service.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for database; sleep 2; done"]
      - name: wait-for-ollama-service
        image: busybox:1.36
        command: ['sh', '-c', "until nslookup ollama-service.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for ollama; sleep 2; done"]
      containers:
      - name: finlyt-app
        image: finlyt-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: myconfigmap
        - secretRef:
            name: secret-finlyt
  
